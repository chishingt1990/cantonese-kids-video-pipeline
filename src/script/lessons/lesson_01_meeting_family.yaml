episode_id: "ep01_meeting_family"
title_cantonese: "見到屋企人"
title_jyutping: "gin3 dou2 uk1 kei2 jan4"
title_english: "Meeting the Family"
target_age: "1-2 years"
duration_target_seconds: 75

scenes:
  - id: "scene_01_intro"
    duration_sec: 7
    background: "cozy_living_room"
    speaker: "dad"
    action: "Dad waves smiling to camera with warm expression"
    cantonese_text: "Hello 兩個BB！今日爸爸同你哋一齊見下屋企人啦！"
    jyutping: "Hello loeng5 go3 bi4-bi1! Gam1 jat6 baa4-baa1 tung4 nei5 dei6 jat1 cai4 gin3 haa5 uk1 kei2 jan4 laa1!"
    mandarin_text: "Hello 两个宝宝！今天爸爸带你们一起认识家人吧！"
    pinyin: "Hello liǎng gè bǎo bao! Jīn tiān bà ba dài nǐ men yī qǐ rèn shi jiā rén ba!"
    english_translation: "Hello sweet babies! Today Dad will introduce our whole family to you!"
    focus_vocab:
      word: "屋企人"
      jyutping: "uk1 kei2 jan4"
      meaning: "Family"

  - id: "scene_02_dad_mom"
    duration_sec: 12
    background: "cozy_living_room"
    speaker: "dad"
    action: "Dad points to himself, then Mom enters giving Dad a warm smile and waving"
    cantonese_text: "呢個係邊個？係爸爸！Baa4-baa1！仲有溫柔嘅媽媽！Maa4-maa1！"
    jyutping: "Nei1 go3 hai6 bin1 go3? Hai6 baa4-baa1! Baa4-baa1! Zung6 jau5 wan1 jau4 ge3 maa4-maa1! Maa4-maa1!"
    mandarin_text: "这是谁呀？是爸爸！Bà ba！还有温柔的妈妈！Mā ma！"
    pinyin: "Zhè shì shéi ya? Shì bà ba! Bà ba! Hái yǒu wēn róu de mā ma! Mā ma!"
    english_translation: "Who is this? It's Dad! Baa4-baa1! And gentle Mom! Maa4-maa1!"
    focus_vocab:
      - word: "爸爸"
        jyutping: "baa4-baa1"
        meaning: "Dad"
      - word: "媽媽"
        jyutping: "maa4-maa1"
        meaning: "Mom"

  - id: "scene_03_twins"
    duration_sec: 12
    background: "play_mat_with_toys"
    speaker: "dad"
    action: "Levi and Luca are sitting together on playmat playing with colorful blocks while Mom watches lovingly"
    cantonese_text: "睇下！呢度有兩個好得意嘅BB！係 Levi 哥哥同 Luca 細佬呀！笑得好開心！"
    jyutping: "Tai2 haa5! Nei1 dou6 jau5 loeng5 go3 hou2 dak1 ji3 ge3 bi4-bi1! Hai6 Levi go4-go1 tung4 Luca sai3-lou2 aa3! Siu3 dak1 hou2 hoi1 sam1!"
    mandarin_text: "看呀！这里有两个可爱的宝宝！是 Levi 哥哥和 Luca 弟弟呀！笑得多开心！"
    pinyin: "Kàn ya! Zhè li yǒu liǎng gè kě ài de bǎo bao! Shì Levi gē ge hé Luca dì di ya! Xiào de duō kāi xīn!"
    english_translation: "Look! Here are two darling babies! Big brother Levi and little brother Luca, smiling so happily!"
    focus_vocab:
      - word: "哥哥 (Levi)"
        jyutping: "go4-go1"
        meaning: "Big Brother"
      - word: "細佬 (Luca)"
        jyutping: "sai3-lou2"
        meaning: "Little Brother"

  - id: "scene_04_grandparents"
    duration_sec: 14
    background: "dining_room_tea_table"
    speaker: "dad"
    action: "Paternal and maternal grandparents wave and clap their hands joyfully"
    cantonese_text: "哇！爺爺、嫲嫲，仲有公公、婆婆都嚟咗喇！好錫兩個BB㗎！"
    jyutping: "Waa1! Je4-je4, maa4-maa4, zung6 jau5 gung1-gung1, po4-po4 dou1 lai4 zo2 laa3! Hou2 sek3 loeng5 go3 bi4-bi1 gaa3!"
    mandarin_text: "哇！爷爷、奶奶，还有外公、外婆都来啦！最疼爱两个小宝贝了！"
    pinyin: "Wā! Yé ye, nǎi nai, hái yǒu wài gōng, wài pó dōu lái le! Zuì téng ài liǎng gè xiǎo bǎo bao le!"
    english_translation: "Wow! Grandpa and Grandma are all here! They cherish you both so much!"
    focus_vocab:
      - word: "爺爺 / 嫲嫲"
        jyutping: "je4-je4 / maa4-maa4"
        meaning: "Paternal Grandpa / Grandma"
      - word: "公公 / 婆婆"
        jyutping: "gung1-gung1 / po4-po4"
        meaning: "Maternal Grandpa / Grandma"

  - id: "scene_05_aunt_cousins"
    duration_sec: 12
    background: "living_room"
    speaker: "dad"
    action: "Auntie walks in holding hands with the two cousin boys who wave excitedly"
    cantonese_text: "快啲嗌姑媽！仲有表哥同表弟，一齊嚟同你哋玩拋波波啦！"
    jyutping: "Faai3 di1 aai3 gu1-maa1! Zung6 jau5 biu2-go1 tung4 biu2-dai6, jat1 cai4 lai4 tung4 nei5 dei6 waan2 paau1 bo1-bo1 laa1!"
    mandarin_text: "快叫姑姑！还有表哥和表弟，一起跟你们玩球球啦！"
    pinyin: "Kuài jiào gū gu! Hái yǒu biǎo gē hé biǎo dì, yī qǐ gēn nǐ men wán qiú qiu la!"
    english_translation: "Say hello to Auntie! And cousins are here to toss the ball with you!"
    focus_vocab:
      - word: "姑媽"
        jyutping: "gu1-maa1"
        meaning: "Auntie"
      - word: "表哥 / 表弟"
        jyutping: "biu2-go1 / biu2-dai6"
        meaning: "Older Cousin / Younger Cousin"

  - id: "scene_06_dog"
    duration_sec: 10
    background: "living_room_floor"
    speaker: "dad"
    action: "Family dog trots in with tail wagging, resting chin gently near the playmat"
    cantonese_text: "「汪汪！」係邊個？係我哋嘅好朋友——狗狗！狗狗搖尾巴呀！"
    jyutping: "\"Wong1-wong1!\" Hai6 bin1 go3? Hai6 ngo5 dei6 ge3 hou2 pang4 jau5——gau2-gau2! Gau2-gau2 jiu4 mei5 baa1 aa3!"
    mandarin_text: "“汪汪！”是谁呀？是我们的好朋友——小狗！狗狗在摇尾巴呢！"
    pinyin: "\"Wāng wāng!\" Shì shéi ya? Shì wǒ men de hǎo péng you——xiǎo gǒu! Gǒu gou zài yáo wěi ba ne!"
    english_translation: "\"Woof woof!\" Who is that? It's our best friend—the dog! Wagging its tail!"
    focus_vocab:
      word: "狗狗"
      jyutping: "gau2-gau2"
      meaning: "Doggy"

  - id: "scene_07_outro"
    duration_sec: 8
    background: "cozy_living_room"
    speaker: "dad"
    action: "All family members gather together for a family portrait, everyone waves"
    cantonese_text: "我哋全家人都好愛兩個BB！下次再一齊玩啦，拜拜！"
    jyutping: "Ngo5 dei6 cyun4 gaa1 jan4 dou1 hou2 oi3 loeng5 go3 bi4-bi1! Haa6 ci3 zoi3 jat1 cai4 waan2 laa1, baai1-baai3!"
    mandarin_text: "我们全家人都超级爱两个宝宝！下次再一起玩，拜拜！"
    pinyin: "Wǒ men quán jiā rén dōu chāo jí ài liǎng gè bǎo bao! Xià cì zài yī qǐ wán, bái bái!"
    english_translation: "Our whole family loves you both so much! Let's play together next time, bye bye!"
