name: Offline regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -c requirements-lock.txt
      - name: Backend and asset regressions
        run: python -B -m unittest discover -s tests -v
      - name: Frontend regressions
        run: node --test tests/frontend.test.cjs
